# Independent tutorial deployment; included by the source-controlled term-llm vhost.
location = /learn { return 302 /learn/; }
location ^~ /learn/ {
    root /var/www/term-llm-tutorial;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        text/plain txt md;
    }
    include /etc/nginx/term-llm-tutorial/headers.conf;
    include /etc/nginx/term-llm-tutorial/assets.conf;
    autoindex off;
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
