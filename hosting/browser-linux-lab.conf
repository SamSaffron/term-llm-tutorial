# Independent tutorial deployment; scoped route on Cloudflare-proxied wasnotwas.com.
location = /browser-linux-lab { return 302 /browser-linux-lab/; }
location ^~ /browser-linux-lab/ {
    root /var/www/browser-linux-lab-host;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        text/plain txt md;
    }
    include /etc/nginx/snippets/browser-linux-lab-headers.conf;
    include /etc/nginx/snippets/browser-linux-lab-assets.conf;
    autoindex off;
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
