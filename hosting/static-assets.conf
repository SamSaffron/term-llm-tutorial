# Installed by an administrator, never writable by the deployment account.
# Nested inside /learn/. Fingerprinted files no longer require generated nginx rules.
location ~ "^/learn/.+\.css\.[0-9a-f]{20}\.bin$" {
    types { }
    default_type text/css;
    try_files $uri =404;
    include /etc/nginx/term-llm-tutorial/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ "^/learn/.+\.js\.[0-9a-f]{20}\.bin$" {
    types { }
    default_type application/javascript;
    try_files $uri =404;
    include /etc/nginx/term-llm-tutorial/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ "^/learn/.+\.wasm\.[0-9a-f]{20}\.bin$" {
    types { }
    default_type application/wasm;
    try_files $uri =404;
    include /etc/nginx/term-llm-tutorial/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ "^/learn/.+\.[0-9a-f]{20}\.bin$" {
    types { }
    default_type application/octet-stream;
    try_files $uri =404;
    include /etc/nginx/term-llm-tutorial/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
